name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs opt in to what they need.
permissions: {}

env:
  # Pinned identically locally (android/gradle.properties: leocode.ndk) and here.
  NDK_VERSION: "28.2.13676358"

jobs:
  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 14

  android:
    name: Android (tests + lint + assemble + 16 KB)
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: android/app/src/main/assets/web

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests, lint (blocking) and assemble
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Generated bridge types are up to date (Task 7 drift check)
        working-directory: android
        run: |
          ./gradlew --no-daemon generateBridgeTypes
          if [ -n "$(git status --porcelain -- ../web/src/bridge/types.gen.ts)" ]; then
            echo "::error::web/src/bridge/types.gen.ts is stale or untracked. Run ./gradlew generateBridgeTypes and commit the result."
            git --no-pager diff -- ../web/src/bridge/types.gen.ts || true
            exit 1
          fi

      - name: 16 KB page-size check
        run: bash scripts/check-elf-alignment.sh

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leocode-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Temporary nightly channel. Task 28 replaces this with a signed prerelease.
  nightly:
    name: Nightly APK release
    runs-on: ubuntu-latest
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leocode-debug-apk
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          name: "LeoCode IDE (Nightly Build)"
          body: |
            Automated **debug** APK build from commit ${{ github.sha }} on `main`.
            Unsigned-for-release and not shrunk: see plan v9 Task 28.
          files: dist/*.apk
          draft: false
          prerelease: false

  python-runtime:
    name: Python runtime artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/leocode-runtime
          key: python-runtime-${{ hashFiles('runtime-manifests/versions/*.json') }}

      - name: Verify the pinned artifact, layout and 16 KB alignment
        run: |
          python3 scripts/check-runtime-artifact.py \
            --manifest runtime-manifests/versions/python-3.14.10.json \
            --extract-to "$RUNNER_TEMP/runtime"

      - name: Verify the committed manifest and signature
        run: |
          scripts/verify-manifest.sh \
            runtime-manifests/versions/python-3.14.10.json \
            docs/keys/manifest-public.pem
          cmp runtime-manifests/versions/python-3.14.10.json \
            android/app/src/main/assets/runtime/python.json
          cmp runtime-manifests/versions/python-3.14.10.json.sig \
            android/app/src/main/assets/runtime/python.json.sig

      - name: Build the markupsafe Android wheel
        run: |
          python3 runtime-packaging/build_android_wheel.py \
            --recipe runtime-packaging/wheels/markupsafe.json \
            --python-prefix "$RUNNER_TEMP/runtime/prefix" \
            --ndk "$ANDROID_HOME/ndk/${NDK_VERSION}" \
            --out runtime-packaging/out/wheels
          unzip -q runtime-packaging/out/wheels/*.whl -d "$RUNNER_TEMP/wheel"
          bash scripts/check-elf-alignment.sh "$RUNNER_TEMP/wheel/markupsafe"

      - name: Build the wheel index and checksums
        run: |
          python3 runtime-packaging/build_wheel_index.py \
            --wheels runtime-packaging/out/wheels \
            --out runtime-packaging/out/index
          cd runtime-packaging/out
          sha256sum wheels/*.whl > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-runtime
          path: |
            runtime-manifests/versions/python-3.14.10.json
            runtime-manifests/versions/python-3.14.10.json.sig
            runtime-packaging/out/
          retention-days: 14

  python-runtime-release:
    name: Python runtime release (signed)
    runs-on: ubuntu-latest
    needs: python-runtime
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: python-runtime
    permissions:
      contents: write
    env:
      RUNTIME_SIGNING_KEY: ${{ secrets.RUNTIME_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-runtime
          path: dist

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/leocode-runtime
          key: python-runtime-${{ hashFiles('runtime-manifests/versions/*.json') }}

      - name: Prepare the release assets
        run: |
          python3 scripts/check-runtime-artifact.py \
            --manifest dist/runtime-manifests/versions/python-3.14.10.json \
            --skip-alignment \
            --cache-dir /tmp/leocode-runtime
          cp /tmp/leocode-runtime/*.tar.gz dist/

      - name: Sign the manifest with the protected key
        run: |
          if [ -z "$RUNTIME_SIGNING_KEY" ]; then
            echo "::notice::RUNTIME_SIGNING_KEY is not set; skipping the signed release."
            exit 0
          fi
          printf '%s\n' "$RUNTIME_SIGNING_KEY" > "$RUNNER_TEMP/runtime-signing.pem"
          chmod 600 "$RUNNER_TEMP/runtime-signing.pem"
          LEOCODE_MANIFEST_KEY="$RUNNER_TEMP/runtime-signing.pem" \
            scripts/sign-manifest.sh dist/runtime-manifests/versions/python-3.14.10.json
          scripts/verify-manifest.sh \
            dist/runtime-manifests/versions/python-3.14.10.json \
            docs/keys/manifest-public.pem
          rm -f "$RUNNER_TEMP/runtime-signing.pem"

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz \
            runtime-manifests/versions/*.json \
            runtime-manifests/versions/*.json.sig \
            runtime-packaging/out/wheels/*.whl > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the signed runtime release
        if: env.RUNTIME_SIGNING_KEY != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: python-runtime
          name: "Python runtime 3.14.10 (signed)"
          body: |
            Official python.org Android aarch64 build, verified against
            `runtime-manifests/versions/python-3.14.10.json` and mirrored here.
            The manifest is signed with the Ed25519 key from the protected
            `python-runtime` environment; the public half is
            `docs/keys/manifest-public.pem`.
          files: |
            dist/*.tar.gz
            dist/runtime-manifests/versions/*.json
            dist/runtime-manifests/versions/*.json.sig
            dist/runtime-packaging/out/wheels/*.whl
            dist/SHA256SUMS
          prerelease: true
