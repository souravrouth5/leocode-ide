<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Source+Code+Pro:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>LeoCode</title>
    <style>
      /* First-paint splash; removed as soon as React commits. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #f7f8fa;
        color: #1b2028;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      [data-theme="dark"] #boot {
        background: #0f1115;
        color: #e6e9ef;
      }
      .boot-logo {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        box-shadow: 0 14px 36px rgba(111, 157, 255, 0.35);
        animation: boot-pulse 2s ease-in-out infinite alternate;
        object-fit: cover;
      }
      @keyframes boot-pulse {
        from { transform: scale(0.96); opacity: 0.92; }
        to { transform: scale(1.02); opacity: 1; }
      }
      .boot-name {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .boot-note {
        color: #6e7787;
        font-size: 13px;
      }
      [data-theme="dark"] .boot-note {
        color: #8b93a3;
      }
    </style>
    <script>
      // Runs before the stylesheet so the first paint already has the right
      // colours. The Android host passes ?theme=<mode>; otherwise we fall back to
      // the persisted choice, then to the system preference.
      ;(function () {
        var DARK = "#0f1115"
        var LIGHT = "#f7f8fa"
        try {
          var params = new URLSearchParams(location.search)
          var fromUrl = params.get("mode")
          if (fromUrl === "system" || fromUrl === "light" || fromUrl === "dark") {
            localStorage.setItem("leocode.theme", fromUrl)
          }
          var stored = localStorage.getItem("leocode.theme") || "system"
          var forced = params.get("theme")
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          var dark = forced === "dark" || forced === "light"
            ? forced === "dark"
            : stored === "dark" || (stored === "system" && systemDark)
          var theme = dark ? "dark" : "light"
          var root = document.documentElement
          root.dataset.theme = theme
          root.style.colorScheme = theme
          root.style.backgroundColor = dark ? DARK : LIGHT
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", dark ? DARK : LIGHT)
        } catch (e) {
          document.documentElement.dataset.theme = "dark"
        }
      })()
    </script>

    <div id="boot" aria-hidden="true">

        alt="LeoCode Logo"
        class="boot-logo"
        width="84"
        height="84"
      />
      <div class="boot-name">LeoCode</div>
      <div class="boot-note">Starting your mobile IDE…</div>
    </div>
    <div id="root"></div>
  </body>
