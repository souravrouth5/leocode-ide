    <!-- Task 8: strict policy for the asset origin. Vite replaces the

      /* First-paint splash; removed as soon as React commits. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #f7f8fa;
        color: #1b2028;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      [data-theme="dark"] #boot {
        background: #0f1115;
        color: #e6e9ef;
      }
      .boot-logo {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        box-shadow: 0 14px 36px rgba(111, 157, 255, 0.35);
        animation: boot-pulse 2s ease-in-out infinite alternate;
        object-fit: cover;
      }
      @keyframes boot-pulse {
        from { transform: scale(0.96); opacity: 0.92; }
        to { transform: scale(1.02); opacity: 1; }
      }
      .boot-name {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .boot-note {
        color: #6e7787;
        font-size: 13px;
      }
      [data-theme="dark"] .boot-note {
        color: #8b93a3;
      }
