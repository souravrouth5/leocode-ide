org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=400m -Dfile.encoding=UTF-8
# JDK path is machine-specific: keep it in ~/.gradle/gradle.properties, not here.
#   org.gradle.java.home=/path/to/jdk17
# This machine has 3.7 GB RAM; a second JVM for the Kotlin compiler gets OOM-killed.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# NDK r28 ships 16 KB-aligned ELF segments by default (plan v9 §4.3).
# CI installs this exact version; see .github/workflows/ci.yml
leocode.ndk=28.2.13676358
